name: Build Helium
description: Compile, checkpoint, and package Helium within the phase deadline.
inputs:
  fresh_source:
    description: Build and test a clean Xenon source tree
    default: "false"
  preflight_failed:
    description: Save the checkpoint without compiling when preflight checks fail
    required: false
    default: 'false'
  arch:
    description: Target CPU architecture.
    required: true
  GITHUB_TOKEN:
    description: Token used by artifact preparation.
    required: true
  MACOS_CERTIFICATE:
    description: Encoded macOS signing certificate.
  MACOS_CERTIFICATE_PWD:
    description: Password for the signing certificate.
  MACOS_CERTIFICATE_NAME:
    description: Name of the signing identity.
  MACOS_CI_KEYCHAIN_PWD:
    description: Password for the temporary CI keychain.
  PROD_MACOS_NOTARIZATION_APPLE_ID:
    description: Apple ID used for notarization.
  PROD_MACOS_NOTARIZATION_TEAM_ID:
    description: Team identifier used for notarization.
  PROD_MACOS_NOTARIZATION_PWD:
    description: Credential used for notarization.
  PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64:
    description: Encoded provisioning profile for required entitlements.
outputs:
  status:
    description: Whether the phase is running, finished, or failed preflight.
    value: ${{ steps.build.outputs.status }}
runs:
  using: composite
  steps:
    - name: Expose GitHub Actions cache connection to sccache
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
    - name: Show sccache stats before build
      run: timeout -k 5s 30s sccache --show-stats || echo 'Compiler-cache statistics unavailable; continuing.'
      shell: bash

    - name: Build
      id: build
      run: |
        set -o pipefail
        if [ "$ARC_PREFLIGHT_FAILED" = true ]; then
          echo 'Preflight checks failed; saving compiled outputs for diagnosis.'
          echo 'status=tests-failed' >> "$GITHUB_OUTPUT"
          exit 1
        fi
        ./github_build.sh '${{ inputs.arch }}' 2>&1 | tee -a github_actions_build_${{ inputs.arch }}.log
      shell: bash
      env:
        XENON_FRESH_SOURCE: ${{ inputs.fresh_source }}
        ARC_PREFLIGHT_FAILED: ${{ inputs.preflight_failed }}

    - name: Show sccache stats after build
      if: ${{ !cancelled() }}
      run: timeout -k 5s 30s sccache --show-stats || echo 'Compiler-cache statistics unavailable; continuing.'
      shell: bash

    - name: Prepare archive of build as artifact
      if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
      id: bake
      run: |
        set -o pipefail
        ./github_prepare_artifacts.sh '${{ inputs.arch }}' | tee -a github_actions_upload_${{ inputs.arch }}.log
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
        MACOS_CERTIFICATE: ${{ inputs.MACOS_CERTIFICATE }}
        MACOS_CERTIFICATE_PWD: ${{ inputs.MACOS_CERTIFICATE_PWD }}
        MACOS_CERTIFICATE_NAME: ${{ inputs.MACOS_CERTIFICATE_NAME }}
        MACOS_CI_KEYCHAIN_PWD: ${{ inputs.MACOS_CI_KEYCHAIN_PWD }}
        PROD_MACOS_NOTARIZATION_APPLE_ID: ${{ inputs.PROD_MACOS_NOTARIZATION_APPLE_ID }}
        PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ inputs.PROD_MACOS_NOTARIZATION_TEAM_ID }}
        PROD_MACOS_NOTARIZATION_PWD: ${{ inputs.PROD_MACOS_NOTARIZATION_PWD }}
        PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64: ${{ inputs.PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64 }}
    - name: Upload part build artifact
      if: ${{ !cancelled() && steps.bake.outcome == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: github_build_artifact_${{ inputs.arch }}
        path: upload_part_build/
        overwrite: true
    - name: Upload logs
      if: ${{ !cancelled() && steps.bake.outcome == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: github_build_logs_${{ inputs.arch }}
        path: upload_logs/
        overwrite: true
    - name: Upload disk-image and hash file as artifact after build
      if: ${{ steps.build.outputs.status == 'finished' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.bake.outputs.file_name }}
        path: |
          ${{ steps.bake.outputs.deltas }}
          ./release_asset/${{ steps.bake.outputs.file_name }}
          ./${{ steps.bake.outputs.file_name }}.hashes.md

    - name: Upload diagnostics even if checkpoint packaging fails
      if: ${{ !cancelled() && failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: github_failure_diagnostics_${{ inputs.arch }}_${{ github.job }}
        path: |
          github_actions_*.log
          build/src/out/Default/siso_output
          build/src/out/Default/siso_failed_commands.sh
        if-no-files-found: warn
