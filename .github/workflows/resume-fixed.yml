name: Resume Helium with fixed checkpoints
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Verified checkpoint run to resume
        required: true
        default: '42121217689'
permissions:
  contents: read
  actions: read
jobs:
  verify-checkpoint:
    runs-on: ubuntu-latest
    outputs:
      source_run: ${{ steps.checkpoint.outputs.source_run }}
      repair: ${{ steps.checkpoint.outputs.repair_arc_checkpoint }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Require the audited checkpoint
        env:
          HELIUM_REQUESTED_RUN: ${{ inputs.source_run }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('.github/arc-checkpoint-delta.json').read_text())
          if os.environ['HELIUM_REQUESTED_RUN'] != data['source_run']:
              raise SystemExit('Update and verify the checkpoint manifest before selecting another run.')
          PY
      - id: checkpoint
        run: python3 .github/scripts/github_repair_arc_checkpoint.py --select --require-checkpoint
  resume:
    needs: verify-checkpoint
    uses: ./.github/workflows/building.yml
    secrets: inherit
    with:
      arch: arm64
      os: xcode-27
      source_run: ${{ needs.verify-checkpoint.outputs.source_run }}
      repair_arc_checkpoint: ${{ needs.verify-checkpoint.outputs.repair == 'true' }}
