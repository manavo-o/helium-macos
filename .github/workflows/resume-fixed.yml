      resume: true

  build_job_06:
    needs: build_job_05
    if: ${{needs.build_job_05.outputs.status == 'running'}}
    uses: ./.github/workflows/build-phase.yml
    secrets: inherit
    with:
      arch: arm64
      os: macos-latest
      resume: true

  build_job_07:
    needs: build_job_06
    if: ${{needs.build_job_06.outputs.status == 'running'}}
    uses: ./.github/workflows/build-phase.yml
    secrets: inherit
    with:
      arch: arm64
      os: macos-latest
      resume: true

  build_job_08:
    needs: build_job_07
    if: ${{needs.build_job_07.outputs.status == 'running'}}
    uses: ./.github/workflows/build-phase.yml
    secrets: inherit
    with:
      arch: arm64
      os: macos-latest
      resume: true

  build_job_09:
