name: Resume Helium with fixed checkpoints
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Run holding the checkpoint to resume
        required: true
        default: '41259224585'
permissions:
  contents: read
  actions: read
jobs:
  build_job_01:
    uses: ./.github/workflows/build-phase.yml
    secrets: inherit
    with:
      arch: arm64
      os: macos-latest
      resume: true
      source_run: ${{ inputs.source_run }}

  build_job_02:
    needs: build_job_01
    if: ${{needs.build_job_01.outputs.status == 'running'}}
    uses: ./.github/workflows/build-phase.yml
    secrets: inherit
    with:
      arch: arm64
      os: macos-latest
      resume: true

  build_job_03:
    needs: build_job_02
    if: ${{needs.build_job_02.outputs.status == 'running'}}
    uses: ./.github/workflows/build-phase.yml
    secrets: inherit
    with:
      arch: arm64
      os: macos-latest
      resume: true

