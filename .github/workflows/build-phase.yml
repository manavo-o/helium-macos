name: Build Helium for macOS

defaults:
  run:
    shell: bash

permissions:
  contents: read
  actions: read

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      os:
        required: true
        type: string
      source_run:
        required: false
        type: string
        default: ''
      resume:
        required: false
        type: boolean
        default: false
      repair_arc_checkpoint:
        required: false
        type: boolean
        default: false
    outputs:
      status:
        value: ${{ jobs.build_job.outputs.status }}

jobs:
  build_job:
    name: Build Helium for macOS
    runs-on: ${{ inputs.os }}
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/prepare-environment
      - name: Download resources
        if: ${{ !inputs.resume }}
        uses: actions/download-artifact@v4
        with:
          name: helium_macos_resources_${{ inputs.arch }}
      - name: Unpack resources
        if: ${{ !inputs.resume }}
        run: ./github_unpack_resources.sh
      - name: Prepare for building
        if: ${{ !inputs.resume }}
        run: |
          set -o pipefail
          source ./devutils/shared.sh
          configure_build '${{ inputs.arch }}' ci | tee -a github_actions_build_${{ inputs.arch }}.log
        env:
          ARC_MACOS_SPARKLE_ED_PUB_KEY: ${{ secrets.ARC_MACOS_SPARKLE_ED_PUB_KEY }}
          ARC_MACOS_TEAM_ID: ${{ vars.ARC_MACOS_TEAM_ID }}
          PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
          PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64: ${{ secrets.PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64 }}
      - name: Get previous logs
        if: ${{ inputs.resume && inputs.source_run == '' }}
        uses: actions/download-artifact@v4
        with:
          name: github_build_logs_${{ inputs.arch }}
      - name: Download build from earlier run
        if: ${{ inputs.resume && inputs.source_run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: github_build_artifact_${{ inputs.arch }}
          run-id: ${{ inputs.source_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download build
        if: ${{ inputs.resume && inputs.source_run == '' }}
        uses: actions/download-artifact@v4
        with:
          name: github_build_artifact_${{ inputs.arch }}
      - name: Unpack archive of build
        if: ${{ inputs.resume }}
        run: ./github_unpack_archive.sh
      - name: Clear previous completion marker
        if: ${{ inputs.resume }}
        run: rm -f 'build_finished_${{ inputs.arch }}.log'
      - name: Apply verified Arc source delta
        if: ${{ inputs.resume && inputs.repair_arc_checkpoint }}
        run: python3 .github/scripts/github_repair_arc_checkpoint.py
      - name: Regenerate native UI build configuration
        if: ${{ inputs.resume && inputs.repair_arc_checkpoint }}
        run: |
          set -o pipefail
          source ./devutils/shared.sh
          configure_build '${{ inputs.arch }}' ci | tee -a github_actions_build_${{ inputs.arch }}.log
        env:
          ARC_MACOS_SPARKLE_ED_PUB_KEY: ${{ secrets.ARC_MACOS_SPARKLE_ED_PUB_KEY }}
          ARC_MACOS_TEAM_ID: ${{ vars.ARC_MACOS_TEAM_ID }}
          PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
          PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64: ${{ secrets.PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64 }}
      - name: Compile palette before continuing browser build
        id: arc-palette
        continue-on-error: true
        if: ${{ inputs.resume && inputs.repair_arc_checkpoint }}
        working-directory: build/src
        run: |
          export SISO_PATH="$PWD/third_party/siso/cipd/siso"
          python3 third_party/depot_tools/autoninja.py -C out/Default obj/chrome/browser/ui/views/tabs/vertical/impl/arc_command_bar_view.o
      - name: Build and run focused routing tests
        id: arc-tests
        continue-on-error: true
        if: ${{ (!inputs.resume || inputs.repair_arc_checkpoint) && steps.arc-palette.outcome != 'failure' }}
        working-directory: build/src
        run: |
          set -o pipefail
          export SISO_PATH="$PWD/third_party/siso/cipd/siso"
          python3 third_party/depot_tools/autoninja.py -C out/Default arc_routing_tests
          ./out/Default/arc_routing_tests --gtest_filter='ArcQuestionRoutingTest.*' | tee ../../github_actions_arc_routing_tests_${{ inputs.arch }}.log
      - uses: ./.github/actions/do-build
        id: build
        with:
          preflight_failed: ${{ steps.arc-palette.outcome == 'failure' || steps.arc-tests.outcome == 'failure' }}
          arch: ${{ inputs.arch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.PROD_MACOS_CERTIFICATE_PWD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_NAME }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
          PROD_MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID }}
          PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
          PROD_MACOS_NOTARIZATION_PWD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }}
          PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64: ${{ secrets.PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64 }}
